<!DOCTYPE html>
<html lang="da">
	<head>
		<meta charset="UTF-8" />
		<title>Tilmelding – Nikoline & Rune</title>
		<link
			rel="stylesheet"
			href="styles.css" />
	</head>
	<body class="page">
		<header class="header">
			<h1 class="script-title">Nikoline & Rune</h1>
			<p class="date-subtitle">9. maj 2025</p>
		</header>

		<section class="container">
			<h2 class="section-title">Tilmelding</h2>
			<p class="lead">
				Vi vil meget gerne vide hvem fra husstanden der ønsker at deltage i
				bryllupsfesten.
			</p>
			<p>
				Husk – vi har allerede registreret jeres husstand, så I skal blot
				markere hvem der kommer.
			</p>

			<form class="signup-form">
				<!-- Example repeated rows -->
				<div class="person-row">
					<label> <input type="checkbox" /> Person 1 </label>
				</div>

				<div class="person-row">
					<label> <input type="checkbox" /> Person 2 </label>
				</div>

				<div class="person-row">
					<label> <input type="checkbox" /> Person 3 </label>
				</div>

				<div class="person-row">
					<label> <input type="checkbox" /> Person 4 </label>
				</div>

				<button
					type="submit"
					class="button">
					Send tilmelding
				</button>
			</form>
		</section>
	</body>
</html>
