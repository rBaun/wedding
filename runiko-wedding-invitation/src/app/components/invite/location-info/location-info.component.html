@if (churchInfo && hotelInfo) {
  <div class="location-info-container">
    <app-location-info-card
      [venueInfo]="churchInfo"
      (click)="onChurchInfoClick()"
    ></app-location-info-card>
    <app-location-info-card
      [venueInfo]="hotelInfo"
      (click)="onHotelInfoClick()"
    ></app-location-info-card>
  </div>
}
